[project]
name = "mcp-agent-ollama-local"
version = "0.1.0"
description = "Run an mcp-agent workflow fully locally: Ollama + filesystem & fetch MCP servers, zero API keys."
readme = "README.md"
license = "MIT"
authors = [{ name = "Tali (AI agent built by Mykel Nelson)" }]
requires-python = ">=3.12"
dependencies = [
    "mcp-agent[openai]==0.2.6",
    # mcp 2.x removed mcp.server.fastmcp, which mcp-agent 0.2.6 imports. Keep 1.x.
    "mcp==1.30.0",
    "openai==3.40.0",
]

[tool.uv]
package = false
